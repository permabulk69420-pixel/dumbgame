<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#11171a">
  <title>VR Cottage Walkthrough</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #11171a; color: #edf2f3; font-family: system-ui, sans-serif; }
    #app { position: relative; width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; }
    #panel {
      position: absolute; top: max(14px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left));
      z-index: 3; max-width: min(470px, calc(100% - 28px)); padding: 12px 14px;
      border: 1px solid rgba(255,255,255,.16); border-radius: 14px;
      background: rgba(12,17,20,.8); backdrop-filter: blur(10px); pointer-events: none;
    }
    #title { font-size: 15px; font-weight: 750; }
    #status { margin-top: 4px; font-size: 13px; color: #b8c5c9; line-height: 1.4; }
    #loading { position:absolute; inset:0; display:grid; place-items:center; z-index:2; background:#11171a; color:#c7d2d5; }
    #app button {
      position:absolute !important; left:max(16px,env(safe-area-inset-left)) !important;
      bottom:max(16px,env(safe-area-inset-bottom)) !important; width:auto !important; min-width:145px;
      height:48px !important; padding:0 18px !important; border:1px solid rgba(255,255,255,.32) !important;
      border-radius:13px !important; background:rgba(24,32,36,.94) !important; color:#fff !important;
      font:700 14px system-ui !important; opacity:1 !important; z-index:5 !important;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="loading">Building dimensioned cottage…</div>
    <div id="panel">
      <div id="title">33 × 37 ft three-bedroom cottage</div>
      <div id="status">Quest: left stick moves, right stick turns smoothly. No snap turning.</div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/+esm';
    import { VRButton } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/VRButton.js/+esm';

    const app = document.getElementById('app');
    const loading = document.getElementById('loading');
    const status = document.getElementById('status');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9fb8c2);
    scene.fog = new THREE.Fog(0x9fb8c2, 28, 65);

    const camera = new THREE.PerspectiveCamera(55, 1, 0.05, 120);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.xr.enabled = true;
    renderer.xr.setReferenceSpaceType('local-floor');
    app.appendChild(renderer.domElement);

    const vrButton = VRButton.createButton(renderer, {
      requiredFeatures: ['local-floor'],
      optionalFeatures: ['bounded-floor']
    });
    app.appendChild(vrButton);

    const rig = new THREE.Group();
    scene.add(rig);
    rig.add(camera);

    scene.add(new THREE.HemisphereLight(0xf5f9fb, 0x675948, 1.75));
    const sun = new THREE.DirectionalLight(0xffefd8, 2.5);
    sun.position.set(10, 18, 8);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -20;
    sun.shadow.camera.right = 20;
    sun.shadow.camera.top = 20;
    sun.shadow.camera.bottom = -20;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 50;
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0x91adc1, 0.55);
    fill.position.set(-12, 8, -13);
    scene.add(fill);

    const MAT = {
      outer: new THREE.MeshStandardMaterial({ color: 0xd9d2c6, roughness: 0.92 }),
      inner: new THREE.MeshStandardMaterial({ color: 0xc8c0b4, roughness: 0.94 }),
      floor: new THREE.MeshStandardMaterial({ color: 0x806f5f, roughness: 0.97 }),
      tile: new THREE.MeshStandardMaterial({ color: 0x858b89, roughness: 0.96 }),
      foundation: new THREE.MeshStandardMaterial({ color: 0x454a4c, roughness: 1 }),
      frame: new THREE.MeshStandardMaterial({ color: 0x34393b, roughness: 0.76 }),
      timber: new THREE.MeshStandardMaterial({ color: 0x4b3a2e, roughness: 0.86 }),
      glass: new THREE.MeshPhysicalMaterial({ color: 0xb9d7df, roughness: 0.15, transparent: true, opacity: 0.38, transmission: 0.2, side: THREE.DoubleSide }),
      grass: new THREE.MeshStandardMaterial({ color: 0x59694f, roughness: 1 }),
      concrete: new THREE.MeshStandardMaterial({ color: 0x77766f, roughness: 1 })
    };

    const F = 0.3048;
    const WIDTH = 33 * F;
    const DEPTH = 32 * F;
    const PORCH_DEPTH = 5 * F;
    const WALL_H = 2.72;
    const WALL_T = 0.17;
    const SLAB_H = 0.14;
    const PLAYER_R = 0.25;

    const xL = -WIDTH / 2;
    const xR = WIDTH / 2;
    const zF = -DEPTH / 2;
    const zB = DEPTH / 2;
    const xBedroomWall = xL + 14 * F;
    const xHallWall = xBedroomWall + 4 * F;
    const zBedroomOne = zF + 10 * F;
    const zBedroomTwo = zF + 20 * F;
    const zLivingKitchen = zF + 16 * F;

    const house = new THREE.Group();
    scene.add(house);
    const collisionSegments = [];

    function box(w, h, d, x, y, z, material, cast = true) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
      mesh.position.set(x, y, z);
      mesh.castShadow = cast;
      mesh.receiveShadow = true;
      house.add(mesh);
      return mesh;
    }

    box(WIDTH, 0.12, DEPTH, 0, -0.06, 0, MAT.foundation);
    box(WIDTH, SLAB_H, DEPTH, 0, SLAB_H / 2, 0, MAT.floor);
    box(6 * F, 0.018, 7 * F, xHallWall + 3 * F, SLAB_H + 0.012, 0.05, MAT.tile, false);
    box(15 * F, 0.018, 8 * F, (xHallWall + xR) / 2, SLAB_H + 0.013, zB - 4 * F, MAT.tile, false);

    box(WIDTH, 0.12, PORCH_DEPTH, 0, 0.02, zF - PORCH_DEPTH / 2, MAT.concrete, false);
    box(12 * F, 0.12, 10 * F, xR - 6 * F, 0.02, zB + 5 * F, MAT.concrete, false);

    function pointAlong(x1, z1, x2, z2, distance) {
      const dx = x2 - x1;
      const dz = z2 - z1;
      const length = Math.hypot(dx, dz);
      return { x: x1 + dx / length * distance, z: z1 + dz / length * distance };
    }

    function addCollision(x1, z1, x2, z2) {
      collisionSegments.push({ x1, z1, x2, z2 });
    }

    function addWallBox(x1, z1, x2, z2, height = WALL_H, y = SLAB_H, material = MAT.outer) {
      const dx = x2 - x1;
      const dz = z2 - z1;
      const length = Math.hypot(dx, dz);
      if (length < 0.005 || height < 0.005) return;
      const mesh = box(length, height, WALL_T, (x1 + x2) / 2, y + height / 2, (z1 + z2) / 2, material);
      mesh.rotation.y = -Math.atan2(dz, dx);
    }

    function addWindow(x1, z1, x2, z2, opening) {
      const centre = pointAlong(x1, z1, x2, z2, opening.at);
      const angle = Math.atan2(z2 - z1, x2 - x1);
      const group = new THREE.Group();
      group.position.set(centre.x, SLAB_H + opening.bottom + opening.height / 2, centre.z);
      group.rotation.y = -angle;

      const glass = new THREE.Mesh(new THREE.BoxGeometry(opening.width * 0.91, opening.height * 0.88, 0.03), MAT.glass);
      group.add(glass);
      const vGeo = new THREE.BoxGeometry(0.055, opening.height, 0.075);
      const hGeo = new THREE.BoxGeometry(opening.width, 0.055, 0.075);
      const left = new THREE.Mesh(vGeo, MAT.frame); left.position.x = -opening.width * 0.47; group.add(left);
      const right = left.clone(); right.position.x = opening.width * 0.47; group.add(right);
      const top = new THREE.Mesh(hGeo, MAT.frame); top.position.y = opening.height * 0.48; group.add(top);
      const bottom = top.clone(); bottom.position.y = -opening.height * 0.48; group.add(bottom);
      const mullion = new THREE.Mesh(vGeo, MAT.frame); group.add(mullion);
      house.add(group);
    }

    function addDoorFrame(x1, z1, x2, z2, opening) {
      const centre = pointAlong(x1, z1, x2, z2, opening.at);
      const angle = Math.atan2(z2 - z1, x2 - x1);
      const group = new THREE.Group();
      group.position.set(centre.x, SLAB_H, centre.z);
      group.rotation.y = -angle;
      const postGeo = new THREE.BoxGeometry(0.07, opening.height, 0.205);
      const left = new THREE.Mesh(postGeo, MAT.timber); left.position.set(-opening.width / 2, opening.height / 2, 0); group.add(left);
      const right = left.clone(); right.position.x = opening.width / 2; group.add(right);
      const top = new THREE.Mesh(new THREE.BoxGeometry(opening.width + 0.07, 0.07, 0.205), MAT.timber); top.position.y = opening.height; group.add(top);
      house.add(group);
    }

    function wallRun(x1, z1, x2, z2, openings = [], material = MAT.outer) {
      const length = Math.hypot(x2 - x1, z2 - z1);
      const sorted = [...openings].sort((a, b) => (a.at - a.width / 2) - (b.at - b.width / 2));
      let cursor = 0;
      for (const opening of sorted) {
        const start = Math.max(0, opening.at - opening.width / 2);
        const end = Math.min(length, opening.at + opening.width / 2);
        if (start > cursor) {
          const a = pointAlong(x1, z1, x2, z2, cursor);
          const b = pointAlong(x1, z1, x2, z2, start);
          addWallBox(a.x, a.z, b.x, b.z, WALL_H, SLAB_H, material);
          addCollision(a.x, a.z, b.x, b.z);
        }
        const a = pointAlong(x1, z1, x2, z2, start);
        const b = pointAlong(x1, z1, x2, z2, end);
        if (opening.kind === 'door') {
          addWallBox(a.x, a.z, b.x, b.z, WALL_H - opening.height, SLAB_H + opening.height, material);
          addDoorFrame(x1, z1, x2, z2, opening);
        } else {
          addWallBox(a.x, a.z, b.x, b.z, opening.bottom, SLAB_H, material);
          const topStart = opening.bottom + opening.height;
          addWallBox(a.x, a.z, b.x, b.z, WALL_H - topStart, SLAB_H + topStart, material);
          addWindow(x1, z1, x2, z2, opening);
          addCollision(a.x, a.z, b.x, b.z);
        }
        cursor = end;
      }
      if (cursor < length) {
        const a = pointAlong(x1, z1, x2, z2, cursor);
        const b = pointAlong(x1, z1, x2, z2, length);
        addWallBox(a.x, a.z, b.x, b.z, WALL_H, SLAB_H, material);
        addCollision(a.x, a.z, b.x, b.z);
      }
    }

    const door = (at, width = 3 * F) => ({ kind: 'door', at, width, height: 2.16 });
    const wide = (at, width = 4 * F) => ({ kind: 'door', at, width, height: 2.35 });
    const windowGap = (at, width = 4 * F, bottom = 0.86, height = 1.18) => ({ kind: 'window', at, width, bottom, height });

    wallRun(xL, zF, xR, zF, [
      windowGap(5 * F, 4 * F),
      door(16 * F, 3 * F),
      windowGap(23 * F, 5 * F),
      windowGap(29.5 * F, 3.5 * F)
    ]);
    wallRun(xR, zF, xR, zB, [windowGap(5 * F), windowGap(13 * F), windowGap(25 * F)]);
    wallRun(xR, zB, xL, zB, [door(5 * F, 3 * F), windowGap(11 * F), windowGap(26 * F)]);
    wallRun(xL, zB, xL, zF, [windowGap(5 * F), windowGap(16 * F), windowGap(27 * F)]);

    wallRun(xL, zBedroomOne, xBedroomWall, zBedroomOne, [], MAT.inner);
    wallRun(xL, zBedroomTwo, xBedroomWall, zBedroomTwo, [], MAT.inner);
    wallRun(xBedroomWall, zF, xBedroomWall, zB, [
      door(5.3 * F), door(15.2 * F), door(25.6 * F)
    ], MAT.inner);

    wallRun(xHallWall, zF, xHallWall, zB, [
      wide(4.4 * F, 4.5 * F),
      door(15.0 * F, 3 * F),
      door(21.6 * F, 2.8 * F),
      wide(27.5 * F, 4.5 * F)
    ], MAT.inner);

    wallRun(xHallWall + 6 * F, zLivingKitchen, xR, zLivingKitchen, [wide(6.5 * F, 5.5 * F)], MAT.inner);

    const bathRight = xHallWall + 6 * F;
    const bathFront = zF + 12 * F;
    const bathBack = zF + 19 * F;
    wallRun(xHallWall, bathFront, bathRight, bathFront, [], MAT.inner);
    wallRun(bathRight, bathFront, bathRight, bathBack, [], MAT.inner);
    wallRun(bathRight, bathBack, xHallWall, bathBack, [], MAT.inner);

    const laundryBack = zF + 25 * F;
    wallRun(xHallWall, bathBack, xHallWall + 4.5 * F, bathBack, [], MAT.inner);
    wallRun(xHallWall + 4.5 * F, bathBack, xHallWall + 4.5 * F, laundryBack, [], MAT.inner);
    wallRun(xHallWall + 4.5 * F, laundryBack, xHallWall, laundryBack, [], MAT.inner);

    const outdoors = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), MAT.grass);
    outdoors.rotation.x = -Math.PI / 2;
    outdoors.position.y = -0.13;
    outdoors.receiveShadow = true;
    scene.add(outdoors);

    const path = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.04, 5.5), MAT.concrete);
    path.position.set(-0.15, -0.04, zF - PORCH_DEPTH - 2.7);
    path.receiveShadow = true;
    scene.add(path);

    for (let i = 0; i < 2; i++) {
      const controller = renderer.xr.getController(i);
      const hand = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.045, 0.16), MAT.frame);
      hand.position.z = -0.08;
      controller.add(hand);
      rig.add(controller);
    }

    function distanceToSegment(px, pz, x1, z1, x2, z2) {
      const vx = x2 - x1, vz = z2 - z1;
      const wx = px - x1, wz = pz - z1;
      const l2 = vx * vx + vz * vz;
      let t = l2 ? (wx * vx + wz * vz) / l2 : 0;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(px - (x1 + t * vx), pz - (z1 + t * vz));
    }

    function canOccupy(x, z) {
      for (const wall of collisionSegments) {
        if (distanceToSegment(x, z, wall.x1, wall.z1, wall.x2, wall.z2) < PLAYER_R + WALL_T * 0.55) return false;
      }
      return true;
    }

    function thumbstick(source) {
      const gamepad = source?.gamepad;
      if (!gamepad?.axes?.length) return { x: 0, y: 0 };
      const axes = gamepad.axes;
      const index = axes.length >= 4 ? axes.length - 2 : 0;
      return { x: axes[index] || 0, y: axes[index + 1] || 0 };
    }

    function deadzone(value, zone = 0.15) {
      const m = Math.abs(value);
      return m < zone ? 0 : Math.sign(value) * (m - zone) / (1 - zone);
    }

    const forward = new THREE.Vector3();
    const right = new THREE.Vector3();
    const movement = new THREE.Vector3();
    const up = new THREE.Vector3(0, 1, 0);

    function updateLocomotion(dt) {
      const session = renderer.xr.getSession();
      if (!session) return;
      let leftSource = null, rightSource = null;
      for (const source of session.inputSources) {
        if (source.handedness === 'left') leftSource = source;
        if (source.handedness === 'right') rightSource = source;
      }
      const left = thumbstick(leftSource);
      const rightStick = thumbstick(rightSource);
      const strafe = deadzone(left.x);
      const advance = deadzone(left.y);
      const turn = deadzone(rightStick.x);

      rig.rotation.y -= turn * 1.9 * dt;
      if (!strafe && !advance) return;

      camera.getWorldDirection(forward);
      forward.y = 0;
      if (forward.lengthSq() < 0.0001) forward.set(0, 0, -1);
      forward.normalize();
      right.crossVectors(forward, up).normalize();
      movement.set(0, 0, 0).addScaledVector(right, strafe).addScaledVector(forward, -advance);
      if (movement.lengthSq() > 1) movement.normalize();
      movement.multiplyScalar(2.25 * dt);

      const nx = rig.position.x + movement.x;
      const nz = rig.position.z + movement.z;
      if (canOccupy(nx, rig.position.z)) rig.position.x = nx;
      if (canOccupy(rig.position.x, nz)) rig.position.z = nz;
    }

    let lastTime = performance.now();
    let previewAngle = 0.5;

    renderer.xr.addEventListener('sessionstart', () => {
      rig.position.set((xBedroomWall + xHallWall) / 2, 0, zF + 2.0);
      rig.rotation.set(0, 0, 0);
      camera.position.set(0, 0, 0);
      status.textContent = 'Left stick moves · right stick turns smoothly';
    });

    renderer.xr.addEventListener('sessionend', () => {
      rig.position.set(0, 0, 0);
      rig.rotation.set(0, 0, 0);
      status.textContent = 'Quest: left stick moves, right stick turns smoothly. No snap turning.';
    });

    function resize() {
      const width = Math.max(1, app.clientWidth);
      const height = Math.max(1, app.clientHeight);
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }
    new ResizeObserver(resize).observe(app);
    resize();
    loading.remove();

    renderer.setAnimationLoop((time) => {
      const dt = Math.min(0.05, (time - lastTime) / 1000);
      lastTime = time;
      if (renderer.xr.isPresenting) {
        updateLocomotion(dt);
      } else {
        previewAngle += dt * 0.08;
        camera.position.set(Math.sin(previewAngle) * 16, 12.5, Math.cos(previewAngle) * 16);
        camera.lookAt(0, 0.7, 0);
      }
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
