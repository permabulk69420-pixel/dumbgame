<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#11171a">
  <title>VR House Walkthrough</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: #11171a;
      color: #edf2f3;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #app { position: relative; width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; }
    #panel {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      left: max(14px, env(safe-area-inset-left));
      z-index: 3;
      max-width: min(430px, calc(100% - 28px));
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 14px;
      background: rgba(12,17,20,.78);
      backdrop-filter: blur(10px);
      pointer-events: none;
    }
    #title { font-size: 15px; font-weight: 750; letter-spacing: .02em; }
    #status { margin-top: 4px; font-size: 13px; color: #b8c5c9; line-height: 1.4; }
    #loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 2;
      color: #c7d2d5;
      background: #11171a;
    }
    #app button {
      position: absolute !important;
      left: max(16px, env(safe-area-inset-left)) !important;
      bottom: max(16px, env(safe-area-inset-bottom)) !important;
      width: auto !important;
      height: 48px !important;
      min-width: 145px;
      padding: 0 18px !important;
      border: 1px solid rgba(255,255,255,.32) !important;
      border-radius: 13px !important;
      background: rgba(24,32,36,.92) !important;
      color: #fff !important;
      font: 700 14px system-ui !important;
      opacity: 1 !important;
      z-index: 5 !important;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="loading">Building house…</div>
    <div id="panel">
      <div id="title">Single-storey VR house</div>
      <div id="status">Open this page in the Quest Browser and press Enter VR. Left stick moves; right stick turns smoothly.</div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/+esm';
    import { VRButton } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/VRButton.js/+esm';

    const app = document.getElementById('app');
    const loading = document.getElementById('loading');
    const status = document.getElementById('status');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9fb7c2);
    scene.fog = new THREE.Fog(0x9fb7c2, 30, 70);

    const camera = new THREE.PerspectiveCamera(54, 1, 0.05, 120);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.xr.enabled = true;
    renderer.xr.setReferenceSpaceType('local-floor');
    app.appendChild(renderer.domElement);

    const vrButton = VRButton.createButton(renderer, {
      requiredFeatures: ['local-floor'],
      optionalFeatures: ['bounded-floor']
    });
    app.appendChild(vrButton);

    const rig = new THREE.Group();
    scene.add(rig);
    rig.add(camera);

    scene.add(new THREE.HemisphereLight(0xf4f8fa, 0x665746, 1.8));

    const sun = new THREE.DirectionalLight(0xffeed6, 2.6);
    sun.position.set(10, 18, 8);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -20;
    sun.shadow.camera.right = 20;
    sun.shadow.camera.top = 20;
    sun.shadow.camera.bottom = -20;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 48;
    scene.add(sun);

    const coolFill = new THREE.DirectionalLight(0x91adc1, 0.55);
    coolFill.position.set(-12, 8, -13);
    scene.add(coolFill);

    const MAT = {
      plaster: new THREE.MeshStandardMaterial({ color: 0xd9d1c4, roughness: 0.92 }),
      inner: new THREE.MeshStandardMaterial({ color: 0xc8c0b4, roughness: 0.94 }),
      floor: new THREE.MeshStandardMaterial({ color: 0x75695d, roughness: 0.97 }),
      tile: new THREE.MeshStandardMaterial({ color: 0x7b807f, roughness: 0.94 }),
      foundation: new THREE.MeshStandardMaterial({ color: 0x464b4d, roughness: 1 }),
      frame: new THREE.MeshStandardMaterial({ color: 0x34393b, roughness: 0.75 }),
      timber: new THREE.MeshStandardMaterial({ color: 0x4c3c30, roughness: 0.84 }),
      glass: new THREE.MeshPhysicalMaterial({
        color: 0xb8d5de,
        roughness: 0.14,
        transparent: true,
        opacity: 0.38,
        transmission: 0.22,
        side: THREE.DoubleSide
      }),
      grass: new THREE.MeshStandardMaterial({ color: 0x59694f, roughness: 1 }),
      path: new THREE.MeshStandardMaterial({ color: 0x77766f, roughness: 1 })
    };

    const house = new THREE.Group();
    scene.add(house);

    const WALL_HEIGHT = 2.72;
    const WALL_THICKNESS = 0.17;
    const SLAB_HEIGHT = 0.14;
    const PLAYER_RADIUS = 0.27;
    const collisionSegments = [];

    // One continuous, slightly irregular house footprint.
    const footprint = [
      [-7.0, -5.0],
      [ 7.0, -5.0],
      [ 7.0,  5.0],
      [ 2.4,  5.0],
      [ 2.4,  6.15],
      [-1.4,  6.15],
      [-1.4,  5.0],
      [-7.0,  5.0]
    ];

    function makeFootprintShape() {
      const shape = new THREE.Shape();
      shape.moveTo(footprint[0][0], -footprint[0][1]);
      for (let i = 1; i < footprint.length; i++) {
        shape.lineTo(footprint[i][0], -footprint[i][1]);
      }
      shape.closePath();
      return shape;
    }

    function addFootprintSlab(material, depth, y) {
      const geometry = new THREE.ExtrudeGeometry(makeFootprintShape(), {
        depth,
        bevelEnabled: false,
        curveSegments: 1
      });
      geometry.rotateX(-Math.PI / 2);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.y = y;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      house.add(mesh);
      return mesh;
    }

    addFootprintSlab(MAT.foundation, 0.12, -0.12);
    addFootprintSlab(MAT.floor, SLAB_HEIGHT, 0);

    // A couple of subtle floor-material changes, still one continuous floor plan.
    function addFloorPatch(x1, z1, x2, z2, material) {
      const patch = new THREE.Mesh(new THREE.PlaneGeometry(x2 - x1, z2 - z1), material);
      patch.rotation.x = -Math.PI / 2;
      patch.position.set((x1 + x2) / 2, SLAB_HEIGHT + 0.008, (z1 + z2) / 2);
      patch.receiveShadow = true;
      house.add(patch);
    }

    addFloorPatch(0.95, 0.12, 3.95, 2.35, MAT.tile);
    addFloorPatch(-1.18, 5.08, 2.18, 5.97, MAT.tile);

    function pointAlong(x1, z1, x2, z2, distance) {
      const dx = x2 - x1;
      const dz = z2 - z1;
      const length = Math.hypot(dx, dz);
      return {
        x: x1 + (dx / length) * distance,
        z: z1 + (dz / length) * distance
      };
    }

    function addCollisionSegment(x1, z1, x2, z2) {
      collisionSegments.push({ x1, z1, x2, z2 });
    }

    function addWallBox(x1, z1, x2, z2, height = WALL_HEIGHT, y = SLAB_HEIGHT, material = MAT.plaster) {
      const dx = x2 - x1;
      const dz = z2 - z1;
      const length = Math.hypot(dx, dz);
      if (length < 0.01 || height < 0.01) return;

      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(length, height, WALL_THICKNESS),
        material
      );
      mesh.position.set((x1 + x2) / 2, y + height / 2, (z1 + z2) / 2);
      mesh.rotation.y = -Math.atan2(dz, dx);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      house.add(mesh);
    }

    function addWindow(x1, z1, x2, z2, opening) {
      const centre = pointAlong(x1, z1, x2, z2, opening.at);
      const angle = Math.atan2(z2 - z1, x2 - x1);
      const group = new THREE.Group();
      group.position.set(
        centre.x,
        SLAB_HEIGHT + opening.bottom + opening.height / 2,
        centre.z
      );
      group.rotation.y = -angle;

      const glass = new THREE.Mesh(
        new THREE.BoxGeometry(opening.width * 0.91, opening.height * 0.89, 0.03),
        MAT.glass
      );
      group.add(glass);

      const verticalGeometry = new THREE.BoxGeometry(0.055, opening.height, 0.075);
      const left = new THREE.Mesh(verticalGeometry, MAT.frame);
      left.position.x = -opening.width * 0.47;
      group.add(left);

      const right = left.clone();
      right.position.x = opening.width * 0.47;
      group.add(right);

      const horizontalGeometry = new THREE.BoxGeometry(opening.width, 0.055, 0.075);
      const top = new THREE.Mesh(horizontalGeometry, MAT.frame);
      top.position.y = opening.height * 0.48;
      group.add(top);

      const bottom = top.clone();
      bottom.position.y = -opening.height * 0.48;
      group.add(bottom);

      const mullion = new THREE.Mesh(verticalGeometry, MAT.frame);
      group.add(mullion);

      house.add(group);
    }

    function addDoorFrame(x1, z1, x2, z2, opening) {
      const centre = pointAlong(x1, z1, x2, z2, opening.at);
      const angle = Math.atan2(z2 - z1, x2 - x1);
      const group = new THREE.Group();
      group.position.set(centre.x, SLAB_HEIGHT, centre.z);
      group.rotation.y = -angle;

      const postGeometry = new THREE.BoxGeometry(0.075, opening.height, 0.21);
      const left = new THREE.Mesh(postGeometry, MAT.timber);
      left.position.set(-opening.width / 2, opening.height / 2, 0);
      group.add(left);

      const right = left.clone();
      right.position.x = opening.width / 2;
      group.add(right);

      const top = new THREE.Mesh(
        new THREE.BoxGeometry(opening.width + 0.075, 0.075, 0.21),
        MAT.timber
      );
      top.position.y = opening.height;
      group.add(top);

      const threshold = new THREE.Mesh(
        new THREE.BoxGeometry(opening.width, 0.025, 0.2),
        MAT.timber
      );
      threshold.position.y = 0.014;
      threshold.receiveShadow = true;
      group.add(threshold);

      house.add(group);
    }

    function wallRun(x1, z1, x2, z2, openings = [], material = MAT.plaster) {
      const length = Math.hypot(x2 - x1, z2 - z1);
      const sorted = [...openings].sort((a, b) => (a.at - a.width / 2) - (b.at - b.width / 2));
      let cursor = 0;

      for (const opening of sorted) {
        const start = Math.max(0, opening.at - opening.width / 2);
        const end = Math.min(length, opening.at + opening.width / 2);

        if (start > cursor) {
          const a = pointAlong(x1, z1, x2, z2, cursor);
          const b = pointAlong(x1, z1, x2, z2, start);
          addWallBox(a.x, a.z, b.x, b.z, WALL_HEIGHT, SLAB_HEIGHT, material);
          addCollisionSegment(a.x, a.z, b.x, b.z);
        }

        const a = pointAlong(x1, z1, x2, z2, start);
        const b = pointAlong(x1, z1, x2, z2, end);

        if (opening.kind === 'door') {
          const lintelHeight = WALL_HEIGHT - opening.height;
          addWallBox(a.x, a.z, b.x, b.z, lintelHeight, SLAB_HEIGHT + opening.height, material);
          addDoorFrame(x1, z1, x2, z2, opening);
          // Deliberately no collision segment across a door opening.
        } else {
          addWallBox(a.x, a.z, b.x, b.z, opening.bottom, SLAB_HEIGHT, material);
          const topStart = opening.bottom + opening.height;
          addWallBox(a.x, a.z, b.x, b.z, WALL_HEIGHT - topStart, SLAB_HEIGHT + topStart, material);
          addWindow(x1, z1, x2, z2, opening);
          addCollisionSegment(a.x, a.z, b.x, b.z);
        }

        cursor = end;
      }

      if (cursor < length) {
        const a = pointAlong(x1, z1, x2, z2, cursor);
        const b = pointAlong(x1, z1, x2, z2, length);
        addWallBox(a.x, a.z, b.x, b.z, WALL_HEIGHT, SLAB_HEIGHT, material);
        addCollisionSegment(a.x, a.z, b.x, b.z);
      }
    }

    const door = (at, width = 0.92) => ({
      kind: 'door', at, width, height: 2.18
    });

    const windowGap = (at, width = 1.3, bottom = 0.86, height = 1.16) => ({
      kind: 'window', at, width, bottom, height
    });

    // Exterior shell, including real door/window openings.
    wallRun(-7, -5, 7, -5, [
      windowGap(1.6, 1.45),
      windowGap(4.45, 1.45),
      door(7.0, 1.1),
      windowGap(9.7, 1.45),
      windowGap(12.3, 1.25)
    ]);
    wallRun(7, -5, 7, 5, [windowGap(2.0), windowGap(5.15), windowGap(8.1)]);
    wallRun(7, 5, 2.4, 5, [windowGap(1.5, 1.25)]);
    wallRun(2.4, 5, 2.4, 6.15);
    wallRun(2.4, 6.15, -1.4, 6.15, [door(1.05, 0.92), windowGap(2.7, 0.9, 0.95, 1.0)]);
    wallRun(-1.4, 6.15, -1.4, 5);
    wallRun(-1.4, 5, -7, 5, [windowGap(1.35, 1.15), windowGap(3.85, 1.4)]);
    wallRun(-7, 5, -7, -5, [windowGap(1.4), windowGap(4.25), windowGap(7.25)]);

    // Connected internal plan: central hall, four main rooms, bathroom and rear rooms.
    wallRun(-0.82, -4.0, -0.82, 5, [door(1.65), door(6.25)], MAT.inner);
    wallRun(0.82, -4.0, 0.82, 5, [door(1.65), door(5.15), door(7.55)], MAT.inner);
    wallRun(-7, 0, -0.82, 0, [], MAT.inner);
    wallRun(0.82, 0, 7, 0, [], MAT.inner);
    wallRun(0.82, 2.45, 7, 2.45, [door(2.0), door(4.7)], MAT.inner);
    wallRun(4.08, 0, 4.08, 2.45, [door(1.2, 0.86)], MAT.inner);
    wallRun(-0.82, 5, 0.82, 5, [], MAT.inner);

    const outdoors = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), MAT.grass);
    outdoors.rotation.x = -Math.PI / 2;
    outdoors.position.y = -0.13;
    outdoors.receiveShadow = true;
    scene.add(outdoors);

    const frontPath = new THREE.Mesh(new THREE.BoxGeometry(1.35, 0.04, 6.0), MAT.path);
    frontPath.position.set(0, -0.06, -8.0);
    frontPath.receiveShadow = true;
    scene.add(frontPath);

    // Simple visible controller shapes; no menus or controller-dependent interactions.
    for (let i = 0; i < 2; i++) {
      const controller = renderer.xr.getController(i);
      const handMesh = new THREE.Mesh(
        new THREE.BoxGeometry(0.045, 0.045, 0.16),
        MAT.frame
      );
      handMesh.position.z = -0.08;
      controller.add(handMesh);
      rig.add(controller);
    }

    function distanceToSegment(px, pz, x1, z1, x2, z2) {
      const vx = x2 - x1;
      const vz = z2 - z1;
      const wx = px - x1;
      const wz = pz - z1;
      const lengthSquared = vx * vx + vz * vz;
      let t = lengthSquared ? (wx * vx + wz * vz) / lengthSquared : 0;
      t = Math.max(0, Math.min(1, t));
      const cx = x1 + t * vx;
      const cz = z1 + t * vz;
      return Math.hypot(px - cx, pz - cz);
    }

    function canOccupy(x, z) {
      for (const wall of collisionSegments) {
        if (distanceToSegment(x, z, wall.x1, wall.z1, wall.x2, wall.z2) < PLAYER_RADIUS + WALL_THICKNESS * 0.55) {
          return false;
        }
      }
      return true;
    }

    function thumbstick(source) {
      const gamepad = source?.gamepad;
      if (!gamepad?.axes?.length) return { x: 0, y: 0 };
      const axes = gamepad.axes;
      const index = axes.length >= 4 ? axes.length - 2 : 0;
      return { x: axes[index] || 0, y: axes[index + 1] || 0 };
    }

    function deadzone(value, zone = 0.15) {
      const magnitude = Math.abs(value);
      if (magnitude < zone) return 0;
      return Math.sign(value) * (magnitude - zone) / (1 - zone);
    }

    const forward = new THREE.Vector3();
    const right = new THREE.Vector3();
    const movement = new THREE.Vector3();
    const worldUp = new THREE.Vector3(0, 1, 0);

    function updateLocomotion(dt) {
      const session = renderer.xr.getSession();
      if (!session) return;

      let leftSource = null;
      let rightSource = null;
      for (const source of session.inputSources) {
        if (source.handedness === 'left') leftSource = source;
        if (source.handedness === 'right') rightSource = source;
      }

      const leftStick = thumbstick(leftSource);
      const rightStick = thumbstick(rightSource);
      const strafe = deadzone(leftStick.x);
      const advance = deadzone(leftStick.y);
      const turn = deadzone(rightStick.x);

      // Continuous right-stick turning; no snap-turn state exists anywhere.
      rig.rotation.y -= turn * 1.9 * dt;

      if (strafe === 0 && advance === 0) return;

      camera.getWorldDirection(forward);
      forward.y = 0;
      if (forward.lengthSq() < 0.0001) forward.set(0, 0, -1);
      forward.normalize();
      right.crossVectors(forward, worldUp).normalize();

      movement.set(0, 0, 0)
        .addScaledVector(right, strafe)
        .addScaledVector(forward, -advance);

      if (movement.lengthSq() > 1) movement.normalize();
      movement.multiplyScalar(2.35 * dt);

      const nextX = rig.position.x + movement.x;
      const nextZ = rig.position.z + movement.z;

      // Resolve axes separately so movement slides along walls instead of sticking.
      if (canOccupy(nextX, rig.position.z)) rig.position.x = nextX;
      if (canOccupy(rig.position.x, nextZ)) rig.position.z = nextZ;
    }

    let lastTime = performance.now();
    let previewAngle = 0;

    renderer.xr.addEventListener('sessionstart', () => {
      rig.position.set(0, 0, -3.9);
      rig.rotation.set(0, 0, 0);
      camera.position.set(0, 0, 0);
      renderer.xr.setFoveation(1);
      status.textContent = 'Left stick moves · right stick turns smoothly';
    });

    renderer.xr.addEventListener('sessionend', () => {
      rig.position.set(0, 0, 0);
      rig.rotation.set(0, 0, 0);
      status.textContent = 'Open this page in the Quest Browser and press Enter VR.';
    });

    function resize() {
      const width = Math.max(1, app.clientWidth);
      const height = Math.max(1, app.clientHeight);
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }

    addEventListener('resize', resize);
    resize();
    loading.remove();

    renderer.setAnimationLoop((time) => {
      const dt = Math.min(0.05, (time - lastTime) / 1000);
      lastTime = time;

      if (renderer.xr.isPresenting) {
        updateLocomotion(dt);
      } else {
        previewAngle += dt * 0.08;
        camera.position.set(Math.sin(previewAngle) * 18, 13, Math.cos(previewAngle) * 18);
        camera.lookAt(0, 0.7, 0);
      }

      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
