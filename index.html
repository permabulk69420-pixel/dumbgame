<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#11171a">
  <title>Polished VR Cottage</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #11171a; color: #edf2f3; font-family: system-ui, sans-serif; }
    #app { position: relative; width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; }
    #panel {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      left: max(14px, env(safe-area-inset-left));
      z-index: 3;
      max-width: min(470px, calc(100% - 28px));
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 14px;
      background: rgba(12,17,20,.8);
      backdrop-filter: blur(10px);
      pointer-events: none;
    }
    #title { font-size: 15px; font-weight: 750; }
    #status { margin-top: 4px; font-size: 13px; color: #b8c5c9; line-height: 1.4; }
    #loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 2;
      background: #11171a;
      color: #c7d2d5;
    }
    #app button {
      position: absolute !important;
      left: max(16px, env(safe-area-inset-left)) !important;
      bottom: max(16px, env(safe-area-inset-bottom)) !important;
      width: auto !important;
      min-width: 145px;
      height: 48px !important;
      padding: 0 18px !important;
      border: 1px solid rgba(255,255,255,.32) !important;
      border-radius: 13px !important;
      background: rgba(24,32,36,.94) !important;
      color: #fff !important;
      font: 700 14px system-ui !important;
      opacity: 1 !important;
      z-index: 5 !important;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="loading">Finishing the house…</div>
    <div id="panel">
      <div id="title">Polished expanded cottage</div>
      <div id="status">Quest: left stick moves, right stick turns smoothly. No snap turning.</div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/+esm';
    import { VRButton } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/VRButton.js/+esm';

    const app = document.getElementById('app');
    const loading = document.getElementById('loading');
    const status = document.getElementById('status');

    function makePlasterTexture(base = [218, 213, 204]) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      const image = ctx.createImageData(canvas.width, canvas.height);

      for (let i = 0; i < image.data.length; i += 4) {
        const grain = Math.floor((Math.random() - 0.5) * 9);
        image.data[i] = Math.max(0, Math.min(255, base[0] + grain));
        image.data[i + 1] = Math.max(0, Math.min(255, base[1] + grain));
        image.data[i + 2] = Math.max(0, Math.min(255, base[2] + grain));
        image.data[i + 3] = 255;
      }

      ctx.putImageData(image, 0, 0);
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(3, 3);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    function makeWoodTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#8b715c';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const plankH = 64;
      for (let y = 0; y < canvas.height; y += plankH) {
        ctx.fillStyle = y % (plankH * 2) === 0 ? '#8f755f' : '#836a57';
        ctx.fillRect(0, y, canvas.width, plankH - 2);

        ctx.strokeStyle = 'rgba(50,32,22,.28)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, y + plankH - 2);
        ctx.lineTo(canvas.width, y + plankH - 2);
        ctx.stroke();

        const offset = (y / plankH) % 2 === 0 ? 120 : 380;
        ctx.strokeStyle = 'rgba(55,35,24,.22)';
        ctx.beginPath();
        ctx.moveTo(offset, y);
        ctx.lineTo(offset, y + plankH - 2);
        ctx.stroke();

        for (let i = 0; i < 18; i++) {
          const yy = y + 8 + Math.random() * (plankH - 18);
          ctx.strokeStyle = `rgba(70,42,26,${0.03 + Math.random() * 0.05})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(0, yy);
          ctx.bezierCurveTo(150, yy + Math.random() * 8 - 4, 350, yy + Math.random() * 8 - 4, 512, yy);
          ctx.stroke();
        }
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(9, 8);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    function makeRoofTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#41484c';
      ctx.fillRect(0, 0, 512, 512);

      const rowH = 42;
      for (let y = 0; y < 512; y += rowH) {
        ctx.fillStyle = y % (rowH * 2) === 0 ? '#444b4f' : '#3d4448';
        ctx.fillRect(0, y, 512, rowH - 2);
        ctx.strokeStyle = 'rgba(10,14,16,.45)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, y + rowH - 2);
        ctx.lineTo(512, y + rowH - 2);
        ctx.stroke();

        const shift = (y / rowH) % 2 === 0 ? 0 : 32;
        for (let x = shift; x < 512; x += 64) {
          ctx.strokeStyle = 'rgba(15,19,21,.25)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x, y + rowH - 2);
          ctx.stroke();
        }
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(4, 8);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xa4bac3);
    scene.fog = new THREE.Fog(0xa4bac3, 42, 95);

    const camera = new THREE.PerspectiveCamera(55, 1, 0.05, 160);
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });

    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.xr.enabled = true;
    renderer.xr.setReferenceSpaceType('local-floor');
    app.appendChild(renderer.domElement);

    const vrButton = VRButton.createButton(renderer, {
      requiredFeatures: ['local-floor'],
      optionalFeatures: ['bounded-floor']
    });
    app.appendChild(vrButton);

    const rig = new THREE.Group();
    scene.add(rig);
    rig.add(camera);

    scene.add(new THREE.HemisphereLight(0xf6fafb, 0x66584b, 1.55));

    const sun = new THREE.DirectionalLight(0xffefd8, 2.65);
    sun.position.set(16, 24, 12);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -28;
    sun.shadow.camera.right = 28;
    sun.shadow.camera.top = 28;
    sun.shadow.camera.bottom = -28;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 70;
    sun.shadow.bias = -0.0002;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0x91adc1, 0.52);
    fill.position.set(-16, 10, -16);
    scene.add(fill);

    const plasterTexture = makePlasterTexture();
    const plasterTextureInner = makePlasterTexture([203, 197, 187]);
    const floorTexture = makeWoodTexture();
    const roofTexture = makeRoofTexture();

    const MAT = {
      outer: new THREE.MeshStandardMaterial({
        color: 0xd9d2c6,
        map: plasterTexture,
        roughness: 0.94
      }),
      inner: new THREE.MeshStandardMaterial({
        color: 0xc9c1b5,
        map: plasterTextureInner,
        roughness: 0.95
      }),
      ceiling: new THREE.MeshStandardMaterial({
        color: 0xeeeae3,
        roughness: 0.96
      }),
      floor: new THREE.MeshStandardMaterial({
        color: 0xffffff,
        map: floorTexture,
        roughness: 0.9
      }),
      foundation: new THREE.MeshStandardMaterial({
        color: 0x454a4c,
        roughness: 1
      }),
      trim: new THREE.MeshStandardMaterial({
        color: 0xf0ece4,
        roughness: 0.78
      }),
      timber: new THREE.MeshStandardMaterial({
        color: 0x604733,
        roughness: 0.84
      }),
      frame: new THREE.MeshStandardMaterial({
        color: 0x34393b,
        roughness: 0.76
      }),
      glass: new THREE.MeshPhysicalMaterial({
        color: 0xb9d7df,
        roughness: 0.12,
        transparent: true,
        opacity: 0.42,
        transmission: 0.22,
        side: THREE.DoubleSide
      }),
      roof: new THREE.MeshStandardMaterial({
        color: 0xffffff,
        map: roofTexture,
        roughness: 0.9
      }),
      gutter: new THREE.MeshStandardMaterial({
        color: 0x2f3437,
        roughness: 0.8
      }),
      grass: new THREE.MeshStandardMaterial({
        color: 0x59694f,
        roughness: 1
      }),
      concrete: new THREE.MeshStandardMaterial({
        color: 0x77766f,
        roughness: 1
      }),
      downlight: new THREE.MeshStandardMaterial({
        color: 0xf6f2e8,
        emissive: 0xffe9b8,
        emissiveIntensity: 1.2,
        roughness: 0.35
      })
    };

    // Existing layout remains unchanged. Only horizontal scale was previously increased to 150%.
    const F = 0.3048 * 1.5;
    const WIDTH = 33 * F;
    const DEPTH = 32 * F;
    const PORCH_DEPTH = 5 * F;
    const WALL_H = 2.72;
    const WALL_T = 0.17;
    const SLAB_H = 0.14;
    const PLAYER_R = 0.25;

    const xL = -WIDTH / 2;
    const xR = WIDTH / 2;
    const zF = -DEPTH / 2;
    const zB = DEPTH / 2;
    const xBedroomWall = xL + 14 * F;
    const xHallWall = xBedroomWall + 4 * F;
    const zBedroomOne = zF + 10 * F;
    const zBedroomTwo = zF + 20 * F;
    const zLivingKitchen = zF + 16 * F;

    const house = new THREE.Group();
    scene.add(house);
    const collisionSegments = [];
    const jointQueue = new Map();

    function box(w, h, d, x, y, z, material, cast = true, parent = house) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
      mesh.position.set(x, y, z);
      mesh.castShadow = cast;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    box(WIDTH, 0.12, DEPTH, 0, -0.06, 0, MAT.foundation);
    box(WIDTH, SLAB_H, DEPTH, 0, SLAB_H / 2, 0, MAT.floor);

    box(WIDTH, 0.12, PORCH_DEPTH, 0, 0.02, zF - PORCH_DEPTH / 2, MAT.concrete, false);
    box(12 * F, 0.12, 10 * F, xR - 6 * F, 0.02, zB + 5 * F, MAT.concrete, false);

    function pointAlong(x1, z1, x2, z2, distance) {
      const dx = x2 - x1;
      const dz = z2 - z1;
      const length = Math.hypot(dx, dz);
      return {
        x: x1 + dx / length * distance,
        z: z1 + dz / length * distance
      };
    }

    function addCollision(x1, z1, x2, z2) {
      collisionSegments.push({ x1, z1, x2, z2 });
    }

    function queueJoint(x, z, material) {
      const key = `${x.toFixed(3)}:${z.toFixed(3)}`;
      if (!jointQueue.has(key) || material === MAT.outer) {
        jointQueue.set(key, { x, z, material });
      }
    }

    function addWallBox(x1, z1, x2, z2, height = WALL_H, y = SLAB_H, material = MAT.outer) {
      const dx = x2 - x1;
      const dz = z2 - z1;
      const length = Math.hypot(dx, dz);
      if (length < 0.005 || height < 0.005) return null;

      // A small overlap at each end removes the visible hairline seams between wall boxes.
      const paddedLength = length + 0.045;
      const mesh = box(
        paddedLength,
        height,
        WALL_T,
        (x1 + x2) / 2,
        y + height / 2,
        (z1 + z2) / 2,
        material
      );
      mesh.rotation.y = -Math.atan2(dz, dx);
      return mesh;
    }

    function addStrip(x1, z1, x2, z2, y, height, depth, material, side = 0) {
      const dx = x2 - x1;
      const dz = z2 - z1;
      const length = Math.hypot(dx, dz);
      if (length < 0.005) return;

      const nx = -dz / length;
      const nz = dx / length;
      const mesh = box(
        length + 0.03,
        height,
        depth,
        (x1 + x2) / 2 + nx * side,
        y,
        (z1 + z2) / 2 + nz * side,
        material,
        false
      );
      mesh.rotation.y = -Math.atan2(dz, dx);
    }

    function addBaseboardSegment(x1, z1, x2, z2, exterior) {
      const offset = WALL_T / 2 + 0.018;
      const y = SLAB_H + 0.065;
      if (exterior) {
        addStrip(x1, z1, x2, z2, y, 0.13, 0.035, MAT.trim, offset);
      } else {
        addStrip(x1, z1, x2, z2, y, 0.13, 0.035, MAT.trim, offset);
        addStrip(x1, z1, x2, z2, y, 0.13, 0.035, MAT.trim, -offset);
      }
    }

    function addCrownRun(x1, z1, x2, z2, exterior) {
      const offset = WALL_T / 2 + 0.018;
      const y = SLAB_H + WALL_H - 0.055;
      if (exterior) {
        addStrip(x1, z1, x2, z2, y, 0.11, 0.04, MAT.trim, offset);
      } else {
        addStrip(x1, z1, x2, z2, y, 0.11, 0.04, MAT.trim, offset);
        addStrip(x1, z1, x2, z2, y, 0.11, 0.04, MAT.trim, -offset);
      }
    }

    function addWindow(x1, z1, x2, z2, opening) {
      const centre = pointAlong(x1, z1, x2, z2, opening.at);
      const angle = Math.atan2(z2 - z1, x2 - x1);
      const group = new THREE.Group();
      group.position.set(
        centre.x,
        SLAB_H + opening.bottom + opening.height / 2,
        centre.z
      );
      group.rotation.y = -angle;

      const glass = new THREE.Mesh(
        new THREE.BoxGeometry(opening.width * 0.91, opening.height * 0.88, 0.03),
        MAT.glass
      );
      glass.castShadow = false;
      group.add(glass);

      const vGeo = new THREE.BoxGeometry(0.065, opening.height + 0.06, 0.11);
      const hGeo = new THREE.BoxGeometry(opening.width + 0.06, 0.065, 0.11);

      const left = new THREE.Mesh(vGeo, MAT.trim);
      left.position.x = -opening.width * 0.48;
      group.add(left);

      const right = left.clone();
      right.position.x = opening.width * 0.48;
      group.add(right);

      const top = new THREE.Mesh(hGeo, MAT.trim);
      top.position.y = opening.height * 0.5;
      group.add(top);

      const bottom = top.clone();
      bottom.position.y = -opening.height * 0.5;
      group.add(bottom);

      const mullion = new THREE.Mesh(
        new THREE.BoxGeometry(0.052, opening.height * 0.92, 0.08),
        MAT.trim
      );
      group.add(mullion);

      const sill = new THREE.Mesh(
        new THREE.BoxGeometry(opening.width + 0.16, 0.055, 0.28),
        MAT.trim
      );
      sill.position.y = -opening.height * 0.5 - 0.035;
      group.add(sill);

      house.add(group);
    }

    function addDoorFrame(x1, z1, x2, z2, opening) {
      const centre = pointAlong(x1, z1, x2, z2, opening.at);
      const angle = Math.atan2(z2 - z1, x2 - x1);
      const group = new THREE.Group();
      group.position.set(centre.x, SLAB_H, centre.z);
      group.rotation.y = -angle;

      const postGeo = new THREE.BoxGeometry(0.095, opening.height + 0.05, 0.27);
      const left = new THREE.Mesh(postGeo, MAT.trim);
      left.position.set(-opening.width / 2, opening.height / 2, 0);
      group.add(left);

      const right = left.clone();
      right.position.x = opening.width / 2;
      group.add(right);

      const top = new THREE.Mesh(
        new THREE.BoxGeometry(opening.width + 0.095, 0.095, 0.27),
        MAT.trim
      );
      top.position.y = opening.height;
      group.add(top);

      const threshold = new THREE.Mesh(
        new THREE.BoxGeometry(opening.width, 0.028, 0.24),
        MAT.timber
      );
      threshold.position.y = 0.015;
      threshold.receiveShadow = true;
      group.add(threshold);

      house.add(group);
    }

    function wallRun(x1, z1, x2, z2, openings = [], material = MAT.outer) {
      const exterior = material === MAT.outer;
      const length = Math.hypot(x2 - x1, z2 - z1);
      const sorted = [...openings].sort(
        (a, b) => (a.at - a.width / 2) - (b.at - b.width / 2)
      );

      queueJoint(x1, z1, material);
      queueJoint(x2, z2, material);
      addCrownRun(x1, z1, x2, z2, exterior);

      let cursor = 0;

      for (const opening of sorted) {
        const start = Math.max(0, opening.at - opening.width / 2);
        const end = Math.min(length, opening.at + opening.width / 2);

        if (start > cursor) {
          const a = pointAlong(x1, z1, x2, z2, cursor);
          const b = pointAlong(x1, z1, x2, z2, start);
          addWallBox(a.x, a.z, b.x, b.z, WALL_H, SLAB_H, material);
          addCollision(a.x, a.z, b.x, b.z);
          addBaseboardSegment(a.x, a.z, b.x, b.z, exterior);
        }

        const a = pointAlong(x1, z1, x2, z2, start);
        const b = pointAlong(x1, z1, x2, z2, end);

        if (opening.kind === 'door') {
          addWallBox(
            a.x,
            a.z,
            b.x,
            b.z,
            WALL_H - opening.height,
            SLAB_H + opening.height,
            material
          );
          addDoorFrame(x1, z1, x2, z2, opening);
        } else {
          addWallBox(
            a.x,
            a.z,
            b.x,
            b.z,
            opening.bottom,
            SLAB_H,
            material
          );
          const topStart = opening.bottom + opening.height;
          addWallBox(
            a.x,
            a.z,
            b.x,
            b.z,
            WALL_H - topStart,
            SLAB_H + topStart,
            material
          );
          addWindow(x1, z1, x2, z2, opening);
          addCollision(a.x, a.z, b.x, b.z);
          addBaseboardSegment(a.x, a.z, b.x, b.z, exterior);
        }

        cursor = end;
      }

      if (cursor < length) {
        const a = pointAlong(x1, z1, x2, z2, cursor);
        const b = pointAlong(x1, z1, x2, z2, length);
        addWallBox(a.x, a.z, b.x, b.z, WALL_H, SLAB_H, material);
        addCollision(a.x, a.z, b.x, b.z);
        addBaseboardSegment(a.x, a.z, b.x, b.z, exterior);
      }
    }

    const door = (at, width = 3 * F) => ({
      kind: 'door',
      at,
      width,
      height: 2.16
    });

    const wide = (at, width = 4 * F) => ({
      kind: 'door',
      at,
      width,
      height: 2.35
    });

    const windowGap = (at, width = 4 * F, bottom = 0.86, height = 1.18) => ({
      kind: 'window',
      at,
      width,
      bottom,
      height
    });

    wallRun(xL, zF, xR, zF, [
      windowGap(5 * F, 4 * F),
      door(16 * F, 3 * F),
      windowGap(23 * F, 5 * F),
      windowGap(29.5 * F, 3.5 * F)
    ]);

    wallRun(xR, zF, xR, zB, [
      windowGap(5 * F),
      windowGap(13 * F),
      windowGap(25 * F)
    ]);

    wallRun(xR, zB, xL, zB, [
      door(5 * F, 3 * F),
      windowGap(11 * F),
      windowGap(26 * F)
    ]);

    wallRun(xL, zB, xL, zF, [
      windowGap(5 * F),
      windowGap(16 * F),
      windowGap(27 * F)
    ]);

    wallRun(xL, zBedroomOne, xBedroomWall, zBedroomOne, [], MAT.inner);
    wallRun(xL, zBedroomTwo, xBedroomWall, zBedroomTwo, [], MAT.inner);

    wallRun(xBedroomWall, zF, xBedroomWall, zB, [
      door(5.3 * F),
      door(15.2 * F),
      door(25.6 * F)
    ], MAT.inner);

    wallRun(xHallWall, zF, xHallWall, zB, [
      wide(4.4 * F, 4.5 * F),
      door(15.0 * F, 3 * F),
      door(21.6 * F, 2.8 * F),
      wide(27.5 * F, 4.5 * F)
    ], MAT.inner);

    wallRun(
      xHallWall + 6 * F,
      zLivingKitchen,
      xR,
      zLivingKitchen,
      [wide(6.5 * F, 5.5 * F)],
      MAT.inner
    );

    const bathRight = xHallWall + 6 * F;
    const bathFront = zF + 12 * F;
    const bathBack = zF + 19 * F;

    wallRun(xHallWall, bathFront, bathRight, bathFront, [], MAT.inner);
    wallRun(bathRight, bathFront, bathRight, bathBack, [], MAT.inner);
    wallRun(bathRight, bathBack, xHallWall, bathBack, [], MAT.inner);

    const laundryBack = zF + 25 * F;
    wallRun(xHallWall, bathBack, xHallWall + 4.5 * F, bathBack, [], MAT.inner);
    wallRun(
      xHallWall + 4.5 * F,
      bathBack,
      xHallWall + 4.5 * F,
      laundryBack,
      [],
      MAT.inner
    );
    wallRun(
      xHallWall + 4.5 * F,
      laundryBack,
      xHallWall,
      laundryBack,
      [],
      MAT.inner
    );

    for (const joint of jointQueue.values()) {
      box(
        WALL_T + 0.055,
        WALL_H,
        WALL_T + 0.055,
        joint.x,
        SLAB_H + WALL_H / 2,
        joint.z,
        joint.material
      );
    }

    for (const [x, z] of [[xL, zF], [xR, zF], [xR, zB], [xL, zB]]) {
      box(0.13, WALL_H + 0.04, 0.13, x, SLAB_H + WALL_H / 2, z, MAT.trim);
    }

    const ceilingY = SLAB_H + WALL_H - 0.045;
    box(
      WIDTH - WALL_T * 1.2,
      0.09,
      DEPTH - WALL_T * 1.2,
      0,
      ceilingY,
      0,
      MAT.ceiling,
      true
    );

    function addDownlight(x, z, intensity = 24) {
      const fixture = new THREE.Mesh(
        new THREE.CylinderGeometry(0.09, 0.09, 0.025, 18),
        MAT.downlight
      );
      fixture.position.set(x, ceilingY - 0.06, z);
      fixture.castShadow = false;
      house.add(fixture);

      const light = new THREE.PointLight(0xffe6b8, intensity, 8.5, 2);
      light.position.set(x, ceilingY - 0.18, z);
      light.castShadow = false;
      house.add(light);
    }

    addDownlight((xL + xBedroomWall) / 2, (zF + zBedroomOne) / 2, 20);
    addDownlight((xL + xBedroomWall) / 2, (zBedroomOne + zBedroomTwo) / 2, 20);
    addDownlight((xL + xBedroomWall) / 2, (zBedroomTwo + zB) / 2, 20);
    addDownlight((xHallWall + xR) / 2, (zF + zLivingKitchen) / 2, 28);
    addDownlight((xHallWall + xR) / 2, (zLivingKitchen + zB) / 2, 28);
    addDownlight((xBedroomWall + xHallWall) / 2, 0, 18);
    addDownlight((xHallWall + bathRight) / 2, (bathFront + bathBack) / 2, 18);
    addDownlight(
      (xHallWall + xHallWall + 4.5 * F) / 2,
      (bathBack + laundryBack) / 2,
      16
    );

    function addGableRoof() {
      const roofGroup = new THREE.Group();
      house.add(roofGroup);

      const overhang = 0.48;
      const halfSpan = WIDTH / 2 + overhang;
      const roofDepth = DEPTH + overhang * 2;
      const eaveY = SLAB_H + WALL_H + 0.12;
      const rise = 1.65;
      const pitch = Math.atan2(rise, halfSpan);
      const slopeLength = Math.hypot(halfSpan, rise);
      const panelThickness = 0.14;

      const leftPanel = box(
        slopeLength,
        panelThickness,
        roofDepth,
        -halfSpan / 2,
        eaveY + rise / 2,
        0,
        MAT.roof,
        true,
        roofGroup
      );
      leftPanel.rotation.z = pitch;

      const rightPanel = box(
        slopeLength,
        panelThickness,
        roofDepth,
        halfSpan / 2,
        eaveY + rise / 2,
        0,
        MAT.roof,
        true,
        roofGroup
      );
      rightPanel.rotation.z = -pitch;

      const gableShape = new THREE.Shape();
      gableShape.moveTo(-WIDTH / 2, 0);
      gableShape.lineTo(WIDTH / 2, 0);
      gableShape.lineTo(0, rise);
      gableShape.closePath();

      const gableGeometry = new THREE.ExtrudeGeometry(gableShape, {
        depth: WALL_T,
        bevelEnabled: false,
        curveSegments: 1
      });

      const frontGable = new THREE.Mesh(gableGeometry, MAT.outer);
      frontGable.position.set(0, eaveY, zF - WALL_T / 2);
      frontGable.castShadow = true;
      frontGable.receiveShadow = true;
      roofGroup.add(frontGable);

      const backGable = new THREE.Mesh(gableGeometry, MAT.outer);
      backGable.position.set(0, eaveY, zB - WALL_T / 2);
      backGable.castShadow = true;
      backGable.receiveShadow = true;
      roofGroup.add(backGable);

      box(
        0.16,
        0.2,
        roofDepth,
        -halfSpan,
        eaveY - 0.03,
        0,
        MAT.trim,
        true,
        roofGroup
      );
      box(
        0.16,
        0.2,
        roofDepth,
        halfSpan,
        eaveY - 0.03,
        0,
        MAT.trim,
        true,
        roofGroup
      );

      for (const z of [zF - overhang, zB + overhang]) {
        const leftBarge = box(
          slopeLength,
          0.15,
          0.12,
          -halfSpan / 2,
          eaveY + rise / 2,
          z,
          MAT.trim,
          true,
          roofGroup
        );
        leftBarge.rotation.z = pitch;

        const rightBarge = box(
          slopeLength,
          0.15,
          0.12,
          halfSpan / 2,
          eaveY + rise / 2,
          z,
          MAT.trim,
          true,
          roofGroup
        );
        rightBarge.rotation.z = -pitch;
      }

      for (const x of [-halfSpan - 0.03, halfSpan + 0.03]) {
        const gutter = new THREE.Mesh(
          new THREE.CylinderGeometry(0.07, 0.07, roofDepth, 12),
          MAT.gutter
        );
        gutter.rotation.x = Math.PI / 2;
        gutter.position.set(x, eaveY - 0.13, 0);
        gutter.castShadow = true;
        gutter.receiveShadow = true;
        roofGroup.add(gutter);
      }

      for (const [x, z] of [
        [-halfSpan - 0.03, zF - overhang + 0.18],
        [halfSpan + 0.03, zB + overhang - 0.18]
      ]) {
        const pipe = new THREE.Mesh(
          new THREE.CylinderGeometry(0.055, 0.055, WALL_H + 0.12, 12),
          MAT.gutter
        );
        pipe.position.set(x, SLAB_H + WALL_H / 2, z);
        pipe.castShadow = true;
        roofGroup.add(pipe);
      }
    }

    addGableRoof();

    const outdoors = new THREE.Mesh(
      new THREE.PlaneGeometry(110, 110),
      MAT.grass
    );
    outdoors.rotation.x = -Math.PI / 2;
    outdoors.position.y = -0.13;
    outdoors.receiveShadow = true;
    scene.add(outdoors);

    const path = new THREE.Mesh(
      new THREE.BoxGeometry(1.35, 0.04, 8.5),
      MAT.concrete
    );
    path.position.set(-0.15, -0.04, zF - PORCH_DEPTH - 4.2);
    path.receiveShadow = true;
    scene.add(path);

    for (let i = 0; i < 2; i++) {
      const controller = renderer.xr.getController(i);
      const hand = new THREE.Mesh(
        new THREE.BoxGeometry(0.045, 0.045, 0.16),
        MAT.frame
      );
      hand.position.z = -0.08;
      controller.add(hand);
      rig.add(controller);
    }

    function distanceToSegment(px, pz, x1, z1, x2, z2) {
      const vx = x2 - x1;
      const vz = z2 - z1;
      const wx = px - x1;
      const wz = pz - z1;
      const lengthSquared = vx * vx + vz * vz;
      let t = lengthSquared ? (wx * vx + wz * vz) / lengthSquared : 0;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(px - (x1 + t * vx), pz - (z1 + t * vz));
    }

    function canOccupy(x, z) {
      for (const wall of collisionSegments) {
        if (
          distanceToSegment(
            x,
            z,
            wall.x1,
            wall.z1,
            wall.x2,
            wall.z2
          ) < PLAYER_R + WALL_T * 0.55
        ) {
          return false;
        }
      }
      return true;
    }

    function thumbstick(source) {
      const gamepad = source?.gamepad;
      if (!gamepad?.axes?.length) return { x: 0, y: 0 };
      const axes = gamepad.axes;
      const index = axes.length >= 4 ? axes.length - 2 : 0;
      return {
        x: axes[index] || 0,
        y: axes[index + 1] || 0
      };
    }

    function deadzone(value, zone = 0.15) {
      const magnitude = Math.abs(value);
      if (magnitude < zone) return 0;
      return Math.sign(value) * (magnitude - zone) / (1 - zone);
    }

    const forward = new THREE.Vector3();
    const right = new THREE.Vector3();
    const movement = new THREE.Vector3();
    const up = new THREE.Vector3(0, 1, 0);

    function updateLocomotion(dt) {
      const session = renderer.xr.getSession();
      if (!session) return;

      let leftSource = null;
      let rightSource = null;

      for (const source of session.inputSources) {
        if (source.handedness === 'left') leftSource = source;
        if (source.handedness === 'right') rightSource = source;
      }

      const left = thumbstick(leftSource);
      const rightStick = thumbstick(rightSource);
      const strafe = deadzone(left.x);
      const advance = deadzone(left.y);
      const turn = deadzone(rightStick.x);

      rig.rotation.y -= turn * 1.9 * dt;

      if (!strafe && !advance) return;

      camera.getWorldDirection(forward);
      forward.y = 0;
      if (forward.lengthSq() < 0.0001) forward.set(0, 0, -1);
      forward.normalize();

      right.crossVectors(forward, up).normalize();

      movement
        .set(0, 0, 0)
        .addScaledVector(right, strafe)
        .addScaledVector(forward, -advance);

      if (movement.lengthSq() > 1) movement.normalize();
      movement.multiplyScalar(2.25 * dt);

      const nextX = rig.position.x + movement.x;
      const nextZ = rig.position.z + movement.z;

      if (canOccupy(nextX, rig.position.z)) rig.position.x = nextX;
      if (canOccupy(rig.position.x, nextZ)) rig.position.z = nextZ;
    }

    let lastTime = performance.now();
    let previewAngle = 0.5;

    renderer.xr.addEventListener('sessionstart', () => {
      rig.position.set(
        (xBedroomWall + xHallWall) / 2,
        0,
        zF + 2.0
      );
      rig.rotation.set(0, 0, 0);
      camera.position.set(0, 0, 0);
      status.textContent = 'Left stick moves · right stick turns smoothly';
    });

    renderer.xr.addEventListener('sessionend', () => {
      rig.position.set(0, 0, 0);
      rig.rotation.set(0, 0, 0);
      status.textContent =
        'Quest: left stick moves, right stick turns smoothly. No snap turning.';
    });

    function resize() {
      const width = Math.max(1, app.clientWidth);
      const height = Math.max(1, app.clientHeight);
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }

    new ResizeObserver(resize).observe(app);
    resize();
    loading.remove();

    renderer.setAnimationLoop((time) => {
      const dt = Math.min(0.05, (time - lastTime) / 1000);
      lastTime = time;

      if (renderer.xr.isPresenting) {
        updateLocomotion(dt);
      } else {
        previewAngle += dt * 0.06;
        camera.position.set(
          Math.sin(previewAngle) * 24,
          16,
          Math.cos(previewAngle) * 24
        );
        camera.lookAt(0, 1.0, 0);
      }

      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
